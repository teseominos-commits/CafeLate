# Automatic checks on every push and pull request: install, typecheck, tests and build.
# Generic for Node projects. Steps that the project does not define are skipped.
# Copy to .github/workflows/ci.yml in the project repo. Tested on 2026-10-06.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Tests
        run: npm test --if-present

      - name: Build
        run: npm run build
